<main>
    <div class="hero">
        <h1>
            White Water Rafting Company </h1>
        <p> 123 Main River Street</p>
        <p> Kolob, california</p>
        <p> +1 999 999 9999</p>
        <p> info@whitewater.com</p>

    <section>
        <div class="">
            <iframe class="map-frame"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d92558.10657960133!2d-116.28420959418652!3d43.61871020739988!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54aef170e917b1d1%3A0xa1255e115799e652!2sBoise%2C%20ID!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus">
            </iframe>
        </div>
        </div>

        <form action="">
            <!-- User's Name -->
            <div>
                <label for="name" class="block text-sm font">Your Name <span
                      class="text-red-500">*</span>
                </label>
                <input type="text" id="name" name="name" required class="">
            </div>

            <!-- User's Email -->
            <div>
                <label for="email" class=""> Your Email Address <span class="text-red-500">*</span>
                </label>
                <input type="email" id="email" name="email" required placeholder="austehi56.com">
            </div>

            <!-- Purpose of Message (Radio Buttons) -->
            <fieldset class="">
                <legend class="text-sm font-bold text-slate-800 px-2 font-heading">
                    Purpose of Message <span class="text-red-500">*</span>
                </legend>
                <div class="mt-2 space-y-3">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" id="radio" name="purpose" value="general" required
                          class="w-4 h-4 text-cyan-600 focus:ring-cyan-500">
                        <span class="text-slate-700 font-medium">General Inquiry</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="radio" id="radio" name="purpose" value="reservation" required
                          class="">
                        <span class="font-medium">Reservation Question</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" id="radio" name="purpose" value="website" required
                          class="">
                        <span class="text-slate-700 font-medium">Website Suggestion</span>
                    </label>
                </div>
            </fieldset>

            <!-- Message Textarea -->
            <div>
                <label for="message" class="block text-sm font-bold text-slate-700 mb-2">
                    Your Message <span class="text-red-500">*</span>
                </label>
                <textarea id="message" name="message" rows="5" required
                  placeholder="How can we help you plan your rafting trip?"
                  class="form-textarea w-full px-4 py-3 rounded-lg border border-slate-300 text-slate-800 focus:bg-white transition-all resize-y"></textarea>
            </div>

            <!-- Newsletter Checkbox -->
            <div class="flex-items">
                <input type="checkbox" id="newsletter" name="newsletter" class="">
                <label for="newsletter" class="text"> Please subscribe me to the monthly
                    newsletter</label>
            </div>
            <div class="">
                <button type="submit"> Get in touch</button>
            </div>
        </form>
    </section>
