<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Online Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML &amp; CSS Knowledge Quiz</h1>
    </header>

    <main>
        <form action="#" method="post" class="quiz-form">

            <!-- Question 1: Text Input (Fill in the blank) -->
            <fieldset>
                <legend>Question 1</legend>
                <label for="q1">1. Fill in the blank: HTML stands for HyperText ________
                    Language.</label>
                <input type="text" id="q1" name="q1" required placeholder="Type your answer here">
            </fieldset>

            <!-- Question 2: Textarea Element (Short Answer) -->
            <fieldset>
                <legend>Question 2</legend>
                <label for="q2">2. In your own words, briefly explain the difference between padding
                    and margin in CSS.</label>
                <textarea id="q2" name="q2" rows="4" required
                  placeholder="Write your answer..."></textarea>
            </fieldset>

            <!-- Question 3: Select Element (Dropdown) -->
            <fieldset>
                <legend>Question 3</legend>
                <label for="q3">3. Which CSS property is used to change the background color of an
                    element?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="color">color</option>
                    <option value="background-color">background-color</option>
                    <option value="bgcolor">bgcolor</option>
                    <option value="canvas-color">canvas-color</option>
                </select>
            </fieldset>

            <!-- Question 4: Number Input (Integer Answer) -->
            <fieldset>
                <legend>Question 4</legend>
                <label for="q4">4. How many main levels of heading tags (e.g., &lt;h1&gt; to
                    &lt;h6&gt;) exist in standard HTML?</label>
                <input type="number" id="q4" name="q4" min="1" max="10" required
                  placeholder="Enter a number">
            </fieldset>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit">Submit Quiz</button>
            </div>

        </form>
    </main>
</body>

</html>
